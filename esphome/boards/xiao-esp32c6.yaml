# Seeed XIAO ESP32-C6 -> XIAO Expansion Board pin map
substitutions:
  pin_d0: GPIO0    # Grove A0/D0 (ADC1_CH0)
  pin_d1: GPIO1    # On-board user button
  pin_d3: GPIO21   # On-board passive buzzer (A3)
  pin_sda: GPIO22  # D4
  pin_scl: GPIO23  # D5
  pin_tx: GPIO16   # D6
  pin_rx: GPIO17   # D7

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
