# ESPHome config for the Seeed Studio Expansion Board Base for XIAO
#
# Uses:
#   - On-board 0.96" SSD1306 128x64 OLED (I2C 0x3C)  -> status screen
#   - On-board PCF8563 RTC (I2C 0x51)                 -> keeps time offline
#   - On-board user button (D1)                       -> page switch / HA event
#   - On-board passive buzzer (D3/A3)                 -> RTTTL tones
#   - Grove I2C ports (shared bus, D4/D5)             -> plug in any I2C sensor
#   - Grove UART port (D6 TX / D7 RX)                 -> line reader + sender
#   - Grove A0/D0 port (D0)                           -> analog input (or digital)
#
# Pick your XIAO by changing the board package below.

substitutions:
  name: xiao-expansion
  friendly_name: XIAO Expansion
  uart_baud: "9600"

packages:
  board: !include boards/xiao-esp32c3.yaml
  # board: !include boards/xiao-esp32s3.yaml
  # board: !include boards/xiao-esp32c6.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - pcf8563.read_time: rtc_time

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# ---------------------------------------------------------------- I2C bus ---
# Shared by the OLED, the RTC and both Grove I2C ports.
i2c:
  id: bus_i2c
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true
  frequency: 400kHz

# ------------------------------------------------------------------- Time ---
time:
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf8563.write_time: rtc_time

# ------------------------------------------------------------- Grove UART ---
uart:
  id: grove_uart
  tx_pin: ${pin_tx}
  rx_pin: ${pin_rx}
  baud_rate: ${uart_baud}
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          while (!line.empty() && (line.back() == '\r' || line.back() == '\n'))
            line.pop_back();
          if (!line.empty())
            id(uart_last_line).publish_state(line);

text_sensor:
  - platform: template
    id: uart_last_line
    name: "UART Last Line"
    icon: mdi:serial-port

text:
  - platform: template
    id: uart_tx_text
    name: "UART Send"
    mode: text
    optimistic: true
    max_length: 64
    set_action:
      - uart.write:
          id: grove_uart
          data: !lambda |-
            std::string s = x + "\r\n";
            return std::vector<uint8_t>(s.begin(), s.end());

# ------------------------------------------------------- Grove A0/D0 port ---
sensor:
  - platform: adc
    id: grove_a0
    name: "Grove A0 Voltage"
    pin: ${pin_d0}
    attenuation: 12db
    update_interval: 2s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 60s

# To use the A0/D0 port as a digital input instead, delete the adc sensor
# above and uncomment this:
# binary_sensor:
#   - platform: gpio
#     name: "Grove D0"
#     pin:
#       number: ${pin_d0}
#       mode: INPUT_PULLUP

# --------------------------------------------------------- On-board button ---
binary_sensor:
  - platform: gpio
    id: user_button
    name: "User Button"
    pin:
      number: ${pin_d1}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - display.page.show_next: oled
          - component.update: oled
      - min_length: 1s
        max_length: 5s
        then:
          - rtttl.play: "beep:d=16,o=6,b=200:c,e,g"

# --------------------------------------------------------- On-board buzzer ---
output:
  - platform: ledc
    id: buzzer_pwm
    pin: ${pin_d3}

rtttl:
  id: buzzer
  output: buzzer_pwm

button:
  - platform: template
    name: "Buzzer Beep"
    on_press:
      - rtttl.play: "beep:d=8,o=6,b=180:c"
  - platform: restart
    name: "Restart"

# ------------------------------------------------------------ OLED display ---
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_big
    size: 22

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    pages:
      - id: page_main
        lambda: |-
          auto now = id(rtc_time).now();
          if (id(ha_time).now().is_valid()) now = id(ha_time).now();
          if (now.is_valid()) {
            it.strftime(64, 0, id(font_big), TextAlign::TOP_CENTER, "%H:%M:%S", now);
            it.strftime(64, 24, id(font_small), TextAlign::TOP_CENTER, "%a %Y-%m-%d", now);
          } else {
            it.print(64, 0, id(font_big), TextAlign::TOP_CENTER, "--:--:--");
          }
          if (id(grove_a0).has_state())
            it.printf(0, 40, id(font_small), "A0: %.2f V", id(grove_a0).state);
          if (id(wifi_rssi).has_state())
            it.printf(127, 40, id(font_small), TextAlign::TOP_RIGHT, "%.0f dBm", id(wifi_rssi).state);
          it.printf(0, 52, id(font_small), "BTN: %s", id(user_button).state ? "pressed" : "-");
      - id: page_uart
        lambda: |-
          it.print(0, 0, id(font_small), "UART RX (${uart_baud}):");
          it.line(0, 12, 127, 12);
          std::string s = id(uart_last_line).has_state() ? id(uart_last_line).state : "(nothing yet)";
          // wrap across up to 4 lines of ~21 chars
          for (int row = 0; row < 4 && !s.empty(); row++) {
            it.print(0, 14 + row * 12, id(font_small), s.substr(0, 21).c_str());
            s = s.size() > 21 ? s.substr(21) : "";
          }
